<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#333333">
<title>Budget</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;font-size:16px}
#top{display:flex;gap:4px;padding:6px;height:56px;align-items:center;background:#eee}
#top b{flex:1;text-align:center;padding:10px 0;border-radius:6px}
#top b.on{background:#333;color:#fff}
#top button{padding:10px 14px;font-size:16px;width:auto}
#sw{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:calc(100vh - 56px);height:calc(100dvh - 56px);scrollbar-width:none}
#sw::-webkit-scrollbar{display:none}
section{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:10px 12px}
.in{max-width:760px;margin:auto}
input,button{font-size:18px;padding:10px;margin:3px 0;width:100%}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cats button{width:auto}
.cats .on{background:#333;color:#fff}
.nav{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;text-align:center;gap:6px}
.nav button{width:auto}
table{border-collapse:collapse;width:100%;font-size:14px;table-layout:fixed}
td,th{padding:6px 3px;text-align:right;border-bottom:1px solid #ddd;overflow:hidden}
td:first-child,th:first-child{text-align:left;width:64px}
.ds{text-align:left;font-size:12px;white-space:nowrap;text-overflow:ellipsis}
.sum td{font-weight:bold;border-top:2px solid #333}
.td td{background:#fff6c8}
ul{padding:0;list-style:none}
li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd}
#ov{position:fixed;inset:0;background:#fff;overflow:auto;z-index:9;padding:10px 12px}
.leg span{display:inline-block;margin-right:10px;font-size:13px}
.leg i{display:inline-block;width:10px;height:10px;margin-right:3px}
</style></head><body>

<div id="top">
 <b id="t0" class="on" onclick="go(0)">Ввод</b>
 <b id="t1" onclick="go(1)">Неделя</b>
 <b id="t2" onclick="go(2)">Месяц</b>
 <button onclick="openYear()">Год</button>
</div>

<div id="sw">
 <section><div class="in" id="p0">
  <input type="date" id="dt">
  <input id="amt" type="number" step="0.01" inputmode="decimal" placeholder="Сумма">
  <div class="cats" id="cats"></div>
  <input id="dsc" placeholder="Описание">
  <button onclick="add()">Добавить</button>
  <p id="info"></p>
  <ul id="list"></ul>
  <button onclick="exp()">Резервная копия (JSON)</button>
  <input type="file" accept=".json" onchange="restore(this)">
 </div></section>
 <section><div class="in" id="p1"></div></section>
 <section><div class="in" id="p2"></div></section>
</div>

<div id="ov" hidden><div class="in" id="ovc"></div></div>

<script>
const C=["Income","Food","Car","Personal","Home","Save"],SH=["Inc","Food","Car","Pers","Home","Save"];
const COL=["#e67e22","#3498db","#9b59b6","#2ecc71","#f1c40f"];
const MN=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"],DN=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fv=v=>v?+v.toFixed(2)+"":"",f2=v=>v.toFixed(2);
const iso=t=>new Date(t).toISOString().slice(0,10);
const addD=(s,n)=>iso(Date.parse(s)+n*864e5);
const dow=s=>(new Date(s).getUTCDay()+6)%7;
const monday=s=>addD(s,-dow(s));
const today=()=>{const n=new Date();return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate());};
const sh=s=>s.slice(8)+"."+s.slice(5,7);
const shM=(m,n)=>{const[y,o]=m.split("-").map(Number);return new Date(Date.UTC(y,o-1+n,1)).toISOString().slice(0,7);};
const dim=m=>{const[y,o]=m.split("-").map(Number);return new Date(Date.UTC(y,o,0)).getUTCDate();};

let d=JSON.parse(localStorage.bud||'{"tx":[],"starts":{}}'),cat="Food",I={};
let day0=today(),wk=monday(day0),mo=day0.slice(0,7),Y=+day0.slice(0,4);
const save=()=>localStorage.bud=JSON.stringify(d);

const spent=s=>C.slice(1).reduce((p,c)=>p+s[c],0);
const zero=()=>{const s={};C.forEach(c=>s[c]=0);return s;};
function idx(){I={};d.tx.forEach(x=>(I[x.date]=I[x.date]||[]).push(x));}
function dayTot(date){const s=zero();(I[date]||[]).forEach(x=>s[x.c]+=x.a);return s;}
function mTot(m){const s=zero();d.tx.forEach(x=>{if(x.date.slice(0,7)==m)s[x.c]+=x.a;});return s;}
function firstM(){return d.tx.map(x=>x.date.slice(0,7)).concat(Object.keys(d.starts)).sort()[0]||"";}
function startOf(m){if(d.starts[m]!==undefined)return d.starts[m];const f=firstM();if(!f||m<=f)return 0;return bal(shM(m,-1));}
function bal(m){const s=mTot(m);return startOf(m)+s.Income-spent(s);}
function setStart(v){if(v==="")delete d.starts[mo];else d.starts[mo]=parseFloat(v)||0;save();draw();}

function add(){const a=parseFloat($("amt").value);if(!a||!$("dt").value)return;
 d.tx.push({id:Date.now()+Math.random(),date:$("dt").value,c:cat,a,s:$("dsc").value.trim()});
 $("amt").value=$("dsc").value="";save();draw();$("amt").focus();}
function del(id){if(confirm("Удалить?")){d.tx=d.tx.filter(x=>String(x.id)!=id);save();draw();}}
function pick(date){$("dt").value=date;drawAdd();go(0);}

function drawAdd(){
 C.forEach(c=>$("b"+c).className=c==cat?"on":"");
 const dt=$("dt").value;if(!dt)return;
 $("info").innerHTML=`Расход за день: <b>${f2(spent(dayTot(dt)))}</b> · Баланс месяца: <b>${f2(bal(dt.slice(0,7)))}</b>`;
 $("list").innerHTML=(I[dt]||[]).map(x=>`<li onclick="del('${x.id}')"><span>${x.c} ${esc(x.s)}</span><b>${x.a}</b></li>`).join("");}

function drawWeek(){
 const days=[...Array(7)].map((_,i)=>addD(wk,i)),tot=zero();
 let rows="";
 days.forEach((x,i)=>{const s=dayTot(x);C.forEach(c=>tot[c]+=s[c]);
  const ds=(I[x]||[]).map(t=>t.s).filter(Boolean).join(", ");
  rows+=`<tr onclick="pick('${x}')" class="${x==today()?"td":""}"><td>${DN[i]} ${x.slice(8)}</td>${C.map(c=>`<td>${fv(s[c])}</td>`).join("")}<td class="ds">${esc(ds)}</td></tr>`;});
 $("p1").innerHTML=`<div class="nav"><button onclick="wk=addD(wk,-7);draw()">◀</button><b>${sh(days[0])} – ${sh(days[6])}</b><button onclick="wk=addD(wk,7);draw()">▶</button></div>
 <table><tr><th>День</th>${SH.map(c=>`<th>${c}</th>`).join("")}<th style="width:26%">Описание</th></tr>${rows}
 <tr class="sum"><td>Итого</td>${C.map(c=>`<td>${fv(tot[c])}</td>`).join("")}<td></td></tr></table>
 <p>Расход: <b>${f2(spent(tot))}</b> · Доход: <b>${f2(tot.Income)}</b></p>`;}

function drawMonth(){
 const n=dim(mo),tot=zero();let ws=0,rows="";
 for(let i=1;i<=n;i++){const date=mo+"-"+pad(i),w=dow(date),s=dayTot(date);
  C.forEach(c=>tot[c]+=s[c]);ws+=spent(s);
  const wc=(w==6||i==n)?fv(ws):"";if(w==6||i==n)ws=0;
  rows+=`<tr onclick="pick('${date}')" class="${date==today()?"td":""}"><td>${DN[w]} ${pad(i)}</td>${C.map(c=>`<td>${fv(s[c])}</td>`).join("")}<td>${wc}</td></tr>`;}
 const sp=spent(tot),st=startOf(mo),b=st+tot.Income-sp;
 const shr=C.slice(1).map(c=>`<td>${sp?Math.round(tot[c]/sp*100)+"%":""}</td>`).join("");
 $("p2").innerHTML=`<div class="nav"><button onclick="mo=shM(mo,-1);draw()">◀</button><b>${MN[+mo.slice(5)-1]} ${mo.slice(0,4)}</b><button onclick="mo=shM(mo,1);draw()">▶</button></div>
 Старт месяца (очисти поле, чтобы взять баланс прошлого месяца):
 <input type="number" step="0.01" value="${st.toFixed(2)}" onchange="setStart(this.value)">
 <table><tr><th>День</th>${SH.map(c=>`<th>${c}</th>`).join("")}<th>Нед.</th></tr>${rows}
 <tr class="sum"><td>Итого</td>${C.map(c=>`<td>${fv(tot[c])}</td>`).join("")}<td></td></tr>
 <tr><td>Доля</td><td></td>${shr}<td></td></tr></table>
 <p>Расход: <b>${f2(sp)}</b><br>Баланс: <b>${f2(b)}</b><br>Разница к старту: <b>${f2(b-st)}</b><br>Среднее в неделю: <b>${f2(sp/(n/7))}</b></p>`;}

function openYear(){$("ov").hidden=false;drawYear();}
function drawYear(){
 const hm=new Set(d.tx.map(x=>x.date.slice(0,7)));
 const T=[...Array(12)].map((_,i)=>{const m=Y+"-"+pad(i+1);return{m,s:mTot(m),b:bal(m),has:hm.has(m)};});
 const D=T.filter(t=>t.has);
 let h=`<div class="nav"><button onclick="Y--;drawYear()">◀</button><b>${Y}</b><button onclick="Y++;drawYear()">▶</button></div><button onclick="$('ov').hidden=true">Закрыть</button>`;
 if(!D.length){$("ovc").innerHTML=h+"<p>Нет данных за год.</p>";return;}
 const mx=Math.max(...T.map(t=>spent(t.s)),1),H=170,W=12*42+10;
 let bars=`<svg viewBox="0 0 ${W} ${H+18}" width="100%">`;
 T.forEach((t,i)=>{let y=H;C.slice(1).forEach((c,j)=>{const hh=t.s[c]/mx*H;y-=hh;
  bars+=`<rect x="${i*42+8}" y="${y}" width="30" height="${hh}" fill="${COL[j]}"/>`;});
  bars+=`<text x="${i*42+23}" y="${H+13}" font-size="10" text-anchor="middle">${MN[i]}</text>`;});
 bars+="</svg>";
 const bs=D.map(t=>t.b),lo=Math.min(...bs,0),hi=Math.max(...bs,1),h2=110;
 const yy=b=>h2-(b-lo)/(hi-lo)*h2+5;
 const pts=T.map((t,i)=>t.has?`${i*42+23},${yy(t.b)}`:null).filter(Boolean).join(" ");
 const line=`<svg viewBox="0 0 ${W} ${h2+25}" width="100%"><line x1="0" x2="${W}" y1="${yy(0)}" y2="${yy(0)}" stroke="#ccc"/><polyline points="${pts}" fill="none" stroke="#333" stroke-width="2"/>`
  +T.map((t,i)=>`<text x="${i*42+23}" y="${h2+20}" font-size="10" text-anchor="middle">${MN[i]}</text>`).join("")+"</svg>";
 const cm=today().slice(0,7),F=D.filter(t=>t.m!=cm);
 const sumC=c=>D.reduce((p,t)=>p+t.s[c],0);
 const avg=c=>F.length?F.reduce((p,t)=>p+t.s[c],0)/F.length:0;
 const tsp=F.reduce((p,t)=>p+spent(t.s),0)||1;
 const share=C.slice(1).map(c=>c+" "+Math.round(F.reduce((p,t)=>p+t.s[c],0)/tsp*100)+"%").join(" · ");
 const rows=D.map(t=>`<tr><td>${MN[+t.m.slice(5)-1]}</td>${C.map(c=>`<td>${Math.round(t.s[c])||""}</td>`).join("")}<td><b>${Math.round(t.b)}</b></td></tr>`).join("");
 h+=`<div class="leg">`+C.slice(1).map((c,j)=>`<span><i style="background:${COL[j]}"></i>${c}</span>`).join("")+`</div>`
  +`<h4>Расходы по месяцам</h4>${bars}<h4>Баланс</h4>${line}`
  +`<table><tr><th>Мес</th>${SH.map(c=>`<th>${c}</th>`).join("")}<th>Bal</th></tr>${rows}`
  +`<tr class="sum"><td>Год</td>${C.map(c=>`<td>${Math.round(sumC(c))}</td>`).join("")}<td></td></tr>`
  +`<tr><td>Сред.</td>${C.map(c=>`<td>${Math.round(avg(c))}</td>`).join("")}<td></td></tr></table>`
  +`<p><small>Сред. считается без текущего месяца. Доли расходов: ${share}</small></p>`;
 $("ovc").innerHTML=h;}

function draw(){idx();drawAdd();drawWeek();drawMonth();if(!$("ov").hidden)drawYear();}
function go(i){$("sw").scrollTo({left:i*$("sw").clientWidth,behavior:"smooth"});}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d)]));a.download="budget.json";a.click();}
async function restore(i){try{const j=JSON.parse(await i.files[0].text());if(j.tx&&j.starts){d=j;save();draw();}}catch(e){alert("Неверный файл");}}

$("cats").innerHTML=C.map(c=>`<button id="b${c}" onclick="cat='${c}';drawAdd()">${c}</button>`).join("");
$("dt").value=day0;$("dt").onchange=drawAdd;
$("sw").addEventListener("scroll",()=>{const i=Math.round($("sw").scrollLeft/$("sw").clientWidth);[0,1,2].forEach(k=>$("t"+k).className=k==i?"on":"");});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&day0!=today()){day0=today();$("dt").value=day0;wk=monday(day0);mo=day0.slice(0,7);draw();}});
draw();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
